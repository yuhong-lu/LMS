
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - 智能课程管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@700;900&family=Outfit:wght@200;400;600&family=Satisfy&display=swap');
        
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5, #9333ea);
            --font-sans: 'Outfit', 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #fcfcfd;
            color: #334155;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        .premium-title {
            font-family: var(--font-serif);
            letter-spacing: 0.05em;
        }

        .font-script {
            font-family: 'Satisfy', cursive;
        }

        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: var(--primary-gradient);
        }

        .flow-animation {
            animation: flow-wave 6s ease-in-out infinite;
        }

        @keyframes flow-wave {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(1deg); }
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .soft-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
        }
        
        p, span, div {
            line-height: 1.6;
        }
    </style>
